name: Detect DB Field Additions

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  detect-new-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB field detector
        run: |
          python detect_new_fields.py --base ${{ github.event.pull_request.base.ref }}
